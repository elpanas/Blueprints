name: AutoCheckDeploy

on:
  push:
    branches:
      - main
      - dev
  pull_request: # when it is a marge...
    branches:
      - main # on main branch (that is pull request main <- dev)
    types:
      - closed # and operation is complete
  workflow_dispatch: # manual dev shutdown

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4 # download files from repo
        
      - name: Load configuration
        id: config
        run: | #shell
          echo "=== Caricamento configurazione: $(date) ==="

          # Load the deploy.conf file
          source deploy.conf
          
          # Export variables for the following steps
          {
            echo "APP_NAME=$APP_NAME"
            echo "APP_PATH=$APP_PATH"
            echo "SERVICES=$SERVICES"            
            echo "GIT_REPO=$GIT_REPO"
            echo "VOLUMES=$VOLUMES"
            echo "HEALTHCHECK_TIMEOUT=$HEALTHCHECK_TIMEOUT"
            echo "COMPOSENAME=$COMPOSENAME"
            echo "BRANCH_NAME=$GITHUB_REF_NAME"
          } >> $GITHUB_ENV

          # Load dev variables
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            {
              echo "APP_NAME_DEV=$APP_NAME_DEV"
              echo "APP_PATH_DEV=$APP_PATH_DEV"
              echo "SERVICES_DEV=$SERVICES_DEV"
              echo "VOLUMES_DEV=$VOLUMES_DEV"
              echo "COMPOSENAME_DEV=$COMPOSENAME_DEV"
            } >> $GITHUB_ENV
          fi

      - name: Connetti via SSH e deploya
        uses: appleboy/ssh-action@v0.1.10 # Action to connect via SSH
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          envs: BRANCH_NAME,APP_NAME,APP_PATH,SERVICES,GIT_REPO,VOLUMES,APP_PORT_PY,HEALTHCHECK_TIMEOUT,APP_NAME_DEV,APP_PATH_DEV,SERVICES_DEV,VOLUMES_DEV,COMPOSENAME,COMPOSENAME_DEV
          script: | #shell
            set -e
            echo "=== Deploy iniziato: $(date) ==="

            ###########################################################################
            # INIZIALIZATION
            ###########################################################################
            BRANCH="${BRANCH_NAME}"

            # set variables based on branch
            if [ "$BRANCH" = "dev" ]; then
              APP_NAME="${APP_NAME_DEV}"
              APP_PATH="${APP_PATH_DEV}"
              SERVICES=(${SERVICES_DEV})
              VOLUMES=(${VOLUMES_DEV})
              COMPOSENAME=${COMPOSENAME_DEV}
            fi

            # convert string to array Es.: "backend" "frontend"
            IFS=',' read -ra SERVICES <<< "$SERVICES"
            IFS=',' read -ra VOLUMES <<< "$VOLUMES"
            
            # working directory
            cd "$APP_PATH"

            # log, backup directory
            mkdir -p logs backups

            # log file
            LOGFILE="logs/deploy_$(date +%Y%m%d_%H%M%S).log"
            

            ###########################################################################
            # FUNCTIONS
            ###########################################################################

            # Rollback functions
            rollback() {
              set +e  # disable set -e inside the function
              local SERVICE=$1 SVC_IMAGE=$2 ROLLBACK_IMAGE=$3 CONTAINER=$4

              echo "Errore $SERVICE. Ecco gli ultimi 50 log:"

              # Shows the last 50 logs
              docker logs --tail 50 "$CONTAINER" || true

              # Save the full logs in a timestamped file
              LOG_FULL="logs/${SERVICE}_full_$(date +%Y%m%d_%H%M%S).log"
              docker logs --tail 500 "$CONTAINER" &> "$LOG_FULL" || true
              echo "Log completo di $SERVICE salvato in $LOG_FULL"

              echo "=== Rollback di $SERVICE in corso ==="
              # Check if the rollback image exists
              if docker image inspect "$ROLLBACK_IMAGE" >/dev/null 2>&1; then
                  docker tag "$ROLLBACK_IMAGE" "$SVC_IMAGE:latest" # Rename the rollback image
                  echo "Immagine $SERVICE precedente ripristinata"
              else
                  echo "Immagine di rollback $ROLLBACK_IMAGE non trovata, niente da ripristinare"
              fi

              # Reboot every container
              docker compose -f "$COMPOSENAME" up -d
              exit 1
              set -e  # Enable set -e after the function
            }
            
            # Healthcheck function
            wait_for_health() {
              local SERVICE=$1 CONTAINER=$2
              local TIMEOUT=${HEALTHCHECK_TIMEOUT:-60} ELAPSED=0

              while [ $ELAPSED -lt $TIMEOUT ]; do
                  local STATUS=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "none")
                  
                  case "$STATUS" in
                      "healthy")   echo "$SERVICE healthy"; return 0 ;;
                      "unhealthy") echo "$SERVICE unhealthy"; return 1 ;;
                  esac
                  
                  sleep 2
                  ELAPSED=$((ELAPSED + 2))
              done

              echo "TIMEOUT: $SERVICE dopo ${TIMEOUT}s"
              return 1
            }

            ###########################################################################
            # 1) BACKUP VOLUMES
            ###########################################################################
            # 0. run a docker container alpine where it:
            # 1. mounts the volume to backup inside dir /volume 
            # 2. mounts backup dir on server
            # 3. run a zipped backup of /volume dir
            # 4. write in log and terminal
            echo "--- Backup volumi ---"
            if [ ${#VOLUMES[@]} -eq 0 ]; then
              echo "Nessun volume da backuppare"
            fi

            for VOLUME in "${VOLUMES[@]}"; do
              echo "Backup volume: $VOLUME"

              BACKUP_FILE="$VOLUME.tar.gz"

              if docker run --rm \
                -v "$VOLUME":/volume \
                -v "$APP_PATH/backups":/backup \
                alpine sh -c "tar -czf /backup/$BACKUP_FILE -C /volume . 2>/dev/null"; then
                echo "Backup $VOLUME completato"
              else
                echo "Backup $VOLUME fallito"
              fi
            done | tee -a "$LOGFILE"

            ###########################################################################
            # 2) BACKUP IMAGES FOR ROLLBACK
            ###########################################################################
            for SERVICE in "${SERVICES[@]}"; do
              SVC_IMAGE="$APP_NAME-$SERVICE" # current image
              ROLLBACK_IMAGE="${SVC_IMAGE}_rollback" # rollback image

              echo "--- Preparazione immagine rollback $SERVICE ---"
              if docker image inspect "$SVC_IMAGE:latest" >/dev/null 2>&1; then # if image exists
                docker tag "$SVC_IMAGE:latest" "$ROLLBACK_IMAGE" # tag/rename as rollback
                echo "Immagine $SERVICE salvata come $ROLLBACK_IMAGE"
              else
                echo "Nessuna immagine $SERVICE precedente trovata"
              fi 
            done

            ###########################################################################
            # 3) UPDATE REPO
            ###########################################################################
            if [ ! -d ".git" ]; then
                git init | tee -a "$LOGFILE"
                git remote add origin "$GIT_REPO" | tee -a "$LOGFILE"
                git fetch origin "$BRANCH" | tee -a "$LOGFILE"
                git checkout -b "$BRANCH" FETCH_HEAD | tee -a "$LOGFILE"
            else
                git fetch origin "$BRANCH" | tee -a "$LOGFILE"
                git checkout "$BRANCH" | tee -a "$LOGFILE" || git checkout -b "$BRANCH" origin/"$BRANCH" | tee -a "$LOGFILE"
                git reset --hard origin/"$BRANCH" | tee -a "$LOGFILE"
            fi

            ###########################################################################
            # 4) STOP old containers
            ###########################################################################
            docker compose -f "$COMPOSENAME" down || true

            ###########################################################################
            # 5) BUILD + BOOT NEW CONTAINERS
            ###########################################################################
            echo "--- Docker compose up (build) ---"
            docker compose -f "$COMPOSENAME" up --build -d | tee -a "$LOGFILE"

            # In case of error, uncomment the following lines to build without cache
            # docker compose -f "$COMPOSENAME" build --no-cache | tee -a "$LOGFILE" && \
            # docker compose -f "$COMPOSENAME" up -d | tee -a "$LOGFILE"

            # Check reboots
            for SERVICE in "${SERVICES[@]}"; do
              SVC_IMAGE="$APP_NAME-$SERVICE" # current image
              ROLLBACK_IMAGE="${SVC_IMAGE}_rollback" # rollback image
              CONTAINER=$(docker compose -f "$COMPOSENAME" ps -q "$SERVICE")  # container ID
              RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$CONTAINER") # reboots count

              # if it intercepts ERR in the loop, execute rollback for the current container
              trap 'rollback "$SERVICE" "$SVC_IMAGE" "$ROLLBACK_IMAGE" "$CONTAINER"' ERR

              # if reboots count > 0, execute rollback
              if [ "$RESTARTS" -gt 0 ]; then
                echo "$SERVICE ha avuto $RESTARTS riavvii"
                rollback "$SERVICE" "$SVC_IMAGE" "$ROLLBACK_IMAGE" "$CONTAINER"  
              fi
              
              # if container doesn't responde after timeouts, execute rollback.
              if ! wait_for_health "$SERVICE" "$CONTAINER"; then                  
                rollback "$SERVICE" "$SVC_IMAGE" "$ROLLBACK_IMAGE" "$CONTAINER"                
              fi
              echo "--- Log di $SERVICE ---"
              docker logs --tail 50 "$CONTAINER" || true
            done
            
            ###########################################################################
            # 6) CLEAN UP
            ###########################################################################
            docker image prune -f | tee -a "$LOGFILE" # remove unused images (not rollback images)
            docker builder prune -f | tee -a "$LOGFILE" # remove unused build cache files

            ###########################################################################
            # 7) DEPLOY OK
            ###########################################################################
            echo "--- Deploy completato con successo, rollback precedente conservato ---"
            echo "=== Deploy completato: $(date) ==="      

  shutdown_dev: # Shutdown DEV environment
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Load configuration
        run: | #shell
          echo "=== Caricamento configurazione dev: $(date) ==="
          source deploy.conf
          
          {
            echo "APP_NAME_DEV=$APP_NAME_DEV" 
            echo "COMPOSENAME_DEV=$COMPOSENAME_DEV"
          } >> $GITHUB_ENV

      - name: Stop DEV environment
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          envs: APP_NAME_DEV,COMPOSENAME_DEV
          script: | #shell
            echo "=== Spegnimento ambiente DEV ==="

            cd /srv/$APP_NAME_DEV || exit 0
            docker compose -f ${COMPOSENAME_DEV} down
            echo "=== Ambiente DEV fermato ==="


